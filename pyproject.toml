[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "bcr-root"
version = "0.1.0"
authors = ["DataForGood"]
license = "MIT"
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = "^3.13"

[tool.poetry.group.dev.dependencies]
pre-commit = "^4.6.2"
pytest = "^7.2.0"
httpx = "^0.28.1"
ipykernel = "^6.29.5"

# Configuration Ruff unique pour tous les sous-projets Python (backend,
# data_pipeline) : ruff remonte l'arborescence jusqu'à ce fichier.
# See https://docs.astral.sh/ruff/settings
[tool.ruff]
target-version = "py313"
# Racines des sous-projets : leurs modules (app, pipeline, …) sont des imports
# de première partie pour le tri isort, comme lorsque chaque sous-projet
# portait sa propre configuration.
src = [".", "backend", "data_pipeline"]

[tool.ruff.lint]
# pycodestyle (E4/E7/E9) and pyflakes (F) — the historical Ruff defaults — plus
# isort, flake8-bugbear and pyupgrade. Listed explicitly because Ruff 0.16
# widened its default rule set; adopting those extra rules is a separate step.
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]

[tool.ruff.lint.isort]
# backend/alembic/ (migrations) shadows the alembic package for the
# first-party detection since Ruff 0.16
known-third-party = ["alembic"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's Depends()/Query() in defaults are the documented idiom, not B008
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query"]

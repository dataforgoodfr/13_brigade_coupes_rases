[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "bcr-backend"
version = "0.1.0"
authors = ["DataForGood"]
license = "MIT"
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = "^3.13"

[tool.poetry.group.dev.dependencies]
pre-commit = "^4.6.2"
pytest = "^7.2.0"
httpx = "^0.28.1"
ipykernel = "^6.29.5"
mypy = "^1.16.1"
boto3-stubs = "^1.35.0"
types-shapely = "^2.0"

[tool.poetry.group.backend.dependencies]
python = "^3.13"
fastapi = "^0.141.1"
sqlalchemy = "^2.0.38"
psycopg2-binary = "^2.9.10"
pydantic-settings = "^2.7.1"
uvicorn = "^0.53.0"
geoalchemy2 = "^0.20.0"
alembic = "^1.14.1"
pydantic = { extras = ["email"], version = "^2.7.1" }
shapely = "^2.0.7"
pyjwt = "^2.10.1"
bcrypt = "^4.3.0"
python-multipart = "^0.0.32"
geojson-pydantic = "^1.2.0"
boto3 = "^1.35.0"
pygeofilter = "^0.4.0"
apscheduler = "^3.11.2"
pyairtable = "^3.3.0"

[tool.poetry.scripts]
docker-start = "docker compose up -d --build"
docker-stop = "docker compose down"

[tool.pytest.ini_options]
markers = ["focus: run only these tests"]

# Vérification de types : `make typecheck` (mode par défaut, non strict).
[tool.mypy]
python_version = "3.13"
files = ["app", "test", "alembic", "seed_dev.py", "seed_prd.py", "common_seed.py", "clean_cities.py"]

[[tool.mypy.overrides]]
# apscheduler ne publie ni stubs ni marqueur py.typed
module = ["apscheduler.*"]
ignore_missing_imports = true

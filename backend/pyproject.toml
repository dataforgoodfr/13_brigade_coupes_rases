[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "bcr-backend"
version = "0.1.0"
authors = ["DataForGood"]
license = "MIT"
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = "^3.13"

[tool.poetry.group.dev.dependencies]
pre-commit = "^4.6.2"
pytest = "^9.1.1"
pytest-cov = "^7.0.0"
httpx = "^0.28.1"
ipykernel = "^7.3.0"
mypy = "^2.3.1"
boto3-stubs = "^1.35.0"
types-shapely = "^2.0"

[tool.poetry.group.backend.dependencies]
python = "^3.13"
fastapi = "^0.141.1"
sqlalchemy = "^2.0.38"
psycopg2-binary = "^2.9.10"
pydantic-settings = "^2.7.1"
uvicorn = "^0.53.0"
geoalchemy2 = "^0.20.0"
alembic = "^1.14.1"
pydantic = { extras = ["email"], version = "^2.7.1" }
shapely = "^2.0.7"
pyjwt = "^2.10.1"
bcrypt = "^5.0.0"
python-multipart = "^0.0.32"
geojson-pydantic = "^2.1.2"
boto3 = "^1.35.0"
apscheduler = "^3.11.2"
pyairtable = "^3.3.0"

[tool.poetry.scripts]
docker-start = "docker compose up -d --build"
docker-stop = "docker compose down"

# Tests : `make test-unit` (sans base de données) ou `make test` (tout, avec
# couverture). Les marqueurs unit / integration sont posés automatiquement
# par test/conftest.py d'après le dossier du test.
[tool.pytest.ini_options]
addopts = "--strict-markers"
markers = [
    "unit: tests sans base de données ni réseau (test/unit/)",
    "integration: tests sur une base PostGIS migrée et peuplée",
    "focus: run only these tests",
]

[tool.coverage.run]
source = ["app"]

[tool.coverage.report]
show_missing = true
# Seuil volontairement en dessous de la couverture actuelle (75 %) : il bloque
# les régressions, il n'impose pas de tests inutiles.
fail_under = 70

# Vérification de types : `make typecheck`.
[tool.mypy]
strict = true
python_version = "3.13"
plugins = ["pydantic.mypy"]
files = ["app", "test", "alembic", "seed_dev.py", "seed_prd.py", "common_seed.py", "clean_cities.py"]

[[tool.mypy.overrides]]
# apscheduler ne publie ni stubs ni marqueur py.typed
module = ["apscheduler.*"]
ignore_missing_imports = true

[tool.poetry]
name = "bcr-data-pipeline"
version = "0.1.0"
description = "ETL subproject to ingest datasources, process and load clear cuts data model into the main DB"
authors = ["DataForGood"]
license = "MIT"
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = "^3.13"
boto3 = "^1.37.12"
dask-geopandas = "^0.5.0"
earthengine-api = "^1.7.43"
geoalchemy2 = "^0.20.0"
geopandas = "^1.0.1"
google-cloud-storage = "^3"
numpy = "^2.2.3"
pandas = "^3.0.5"
psycopg2 = "^2.9.10"
py7zr = "^1.1.3"
pyarrow = "^25.0.1"
python-dotenv = "^1.1.0"
rasterio = "^1.4.3"
requests = "^2.32.3"
shapely = "^2.1.0"
sqlalchemy = "^2.0.40"
tqdm = "^4.67.1"

[tool.poetry.group.dev.dependencies]
pre-commit = "^4.6.2"
pytest = "^9.1.1"
pytest-cov = "^7.0.0"
httpx = "^0.28.1"
moto = "^5.1.1"
mypy = "^2.3.1"
types-requests = "^2.32.0.20250328"
pandas-stubs = "^3.0.5"
types-tqdm = "^4.67.0.20250319"
boto3-stubs = "^1.37.12"
types-shapely = "^2.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

# Tests : `poetry run pytest` (tests/, sans base ni S3, couverture de pipeline/).
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov"

[tool.coverage.run]
source = ["pipeline"]

[tool.coverage.report]
show_missing = true

# Vérification de types : `poetry run mypy` (strict). Le sous-projet airtable/
# a son propre environnement (requirements.txt, uv) et n'est pas couvert ici.
[tool.mypy]
strict = true
python_version = "3.13"
files = ["pipeline", "bootstrap", "tests"]
# pipeline/scripts et bootstrap/scripts sont deux paquets distincts sans
# __init__.py parent : les identifier par leur chemin depuis ce dossier.
explicit_package_bases = true

[[tool.mypy.overrides]]
module = [
    "geopandas.*",
    "rasterio.*",
    "osgeo.*",
    "dask_geopandas.*",
    "google.cloud.*",
]
ignore_missing_imports = true

name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag à déployer (ex. v1.2.0) ; par défaut la référence courante"
        required: false
        type: string

# One deployment at a time, never cancelled
# Le GITHUB_TOKEN n'a besoin que de lire le dépôt
permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # Une release vX.Y.Z doit porter la version X.Y.Z dans les trois sous-projets.
  # Pas de contrôle au redéploiement manuel : les anciens tags ne l'ont pas.
  version:
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}
      - name: Versions du tag et des sous-projets
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          expected="${TAG#v}"
          frontend=$(jq -r .version frontend/package.json)
          backend=$(python3 -c 'import tomllib; print(tomllib.load(open("backend/pyproject.toml", "rb"))["project"]["version"])')
          pipeline=$(python3 -c 'import tomllib; print(tomllib.load(open("data_pipeline/pyproject.toml", "rb"))["project"]["version"])')
          echo "tag $TAG, frontend $frontend, backend $backend, pipeline $pipeline"
          test "$frontend" = "$expected" && test "$backend" = "$expected" && test "$pipeline" = "$expected"

  backend:
    needs: version
    # Pre-releases are not deployed
    if: >-
      !cancelled() && (github.event_name == 'workflow_dispatch'
      || (!github.event.release.prerelease && needs.version.result == 'success'))
    uses: "./.github/workflows/deploy.yml"
    secrets: inherit
    with:
      app-id: app_5292f305-0563-4fd7-b50a-56f6caf806db
      ref: ${{ inputs.tag || github.ref }}

  frontend:
    needs: version
    if: >-
      !cancelled() && (github.event_name == 'workflow_dispatch'
      || (!github.event.release.prerelease && needs.version.result == 'success'))
    uses: "./.github/workflows/deploy.yml"
    secrets: inherit
    with:
      app-id: app_ab2f14d8-10a9-454d-9a7d-92ab22a54110
      ref: ${{ inputs.tag || github.ref }}

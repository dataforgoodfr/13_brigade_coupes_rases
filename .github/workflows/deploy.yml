name: Deploy
on:
  workflow_call:
    inputs:
      app-id:
        required: true
        description: "Clever cloud application ID"
        type: string
      ref:
        required: true
        description: "Git ref to deploy (tag or commit)"
        type: string
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
          # clever deploy refuses a shallow clone
          fetch-depth: 0
      - name: Deploy to clever cloud
        uses: 47ng/actions-clever-cloud@v2.2.0
        with:
          appID: ${{ inputs.app-id }}
          force: true
          # Allows redeploying the commit already in production (rollback, env change)
          sameCommitPolicy: rebuild
        env:
          CLEVER_TOKEN: ${{ secrets.CLEVER_TOKEN }}
          CLEVER_SECRET: ${{ secrets.CLEVER_SECRET }}

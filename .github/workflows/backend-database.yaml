name: Backend Database actions
# Enable database actions based on Makefile commands

on:
  workflow_dispatch:
    inputs:
      env:
        required: true
        options:
          - dev
          - prd
        type: choice
        description: "Environment to run the action"
      database-action:
        required: true
        options:
          - upgrade-database
          - setup-database
          - reset-database
          - stamp-and-upgrade
        type: choice
        description: "Seed the database with test data"
      confirmation:
        required: false
        type: string
        description: "Pour reset-database ou setup-database, taper exactement : RESET suivi de l'environnement (ex. RESET prd)"

# Le GITHUB_TOKEN n'a besoin que de lire le dépôt
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apply:
    env:
      DATABASE_URL: ${{secrets.DATABASE_URL}}
      ENVIRONMENT: development

    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.14"]
    steps:
      # DATABASE_URL est le même secret pour dev et prd (la base de production) :
      # la garde vaut pour les deux
      - name: Garde-fou contre la purge ou le peuplement de la base
        if: ${{ (inputs.database-action == 'reset-database' || inputs.database-action == 'setup-database') && inputs.confirmation != format('RESET {0}', inputs.env) }}
        run: |
          echo "::error::${{ inputs.database-action }} vide ou peuple la base : relancer avec la confirmation « RESET ${{ inputs.env }} »."
          exit 1
      - uses: actions/checkout@v7
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Poetry
        run: |
          python -m pip install --upgrade pip
          pip install poetry
      - name: Install development dependencies
        run: make install-dev-dependencies
        working-directory: backend

      - name: Setup and seed database
        working-directory: backend
        if: ${{ inputs.database-action == 'setup-database' }}
        run: |
          make upgrade-db
          make seed-${{ inputs.env }}-db

      - name: Upgrade database
        working-directory: backend
        if: ${{ inputs.database-action == 'upgrade-database' }}
        run: |
          make upgrade-db

      - name: Stamp and upgrade database (repair broken migration head)
        working-directory: backend
        if: ${{ inputs.database-action == 'stamp-and-upgrade' }}
        run: |
          poetry run alembic stamp 19e644f11e20
          make upgrade-db

      - name: Reset database
        working-directory: backend
        if: ${{ inputs.database-action == 'reset-database' }}
        run: make reset-db

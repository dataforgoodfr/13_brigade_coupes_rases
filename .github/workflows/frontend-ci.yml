# This workflow will do a clean installation of node dependencies, cache/restore them, build the source code and run tests across different versions of node
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-nodejs

name: Frontend CI

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "frontend/**"
  pull_request:
    branches: ["main"]
    paths:
      - "frontend/**"

env:
  PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.cache/ms-playwright
# Le GITHUB_TOKEN n'a besoin que de lire le dépôt
permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.nvmrc
          cache-dependency-path: frontend/pnpm-lock.yaml
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install

      - name: Install playwright
        run: pnpm install:playwright

      - name: Lint and format check (Biome)
        run: pnpm lint

      - name: Unit tests (no browser)
        run: pnpm test:unit

      - name: Build project
        run: pnpm run build

      # Browser tests load the built stylesheets, so they run after the build.
      # Coverage covers both projects (unit + browser).
      - name: Browser tests (Playwright) and coverage
        run: pnpm coverage

      - name: Coverage summary
        if: always()
        run: |
          {
            echo "## Couverture frontend"
            echo '```'
            cat coverage/coverage-summary.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"


# This workflow will do a clean installation of node dependencies, cache/restore them, build the source code and run tests across different versions of node
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-nodejs

name: Frontend CI

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "frontend/**"
  pull_request:
    branches: ["main", "develop"]
    paths:
      - "frontend/**"

env:
  PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.cache/ms-playwright
jobs:
  build-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.nvmrc
          cache-dependency-path: frontend/pnpm-lock.yaml
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install

      - name: Install playwright
        run: pnpm install:playwright

      - name: Lint and format check (Biome)
        run: pnpm lint

      - name: Unit tests (no browser)
        run: pnpm test:unit

      - name: Build project
        run: pnpm run build

      # Browser tests load the built stylesheets, so they run after the build
      - name: Browser tests (Playwright)
        run: pnpm test:browser

  deploy:
    # Only after a merge on main; the job is skipped on pull requests
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: build-test
    uses: "./.github/workflows/deploy.yml"
    secrets: inherit
    with:
      app-id: app_ab2f14d8-10a9-454d-9a7d-92ab22a54110
      app-name: "frontend"
